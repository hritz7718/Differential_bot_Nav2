controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_left_wheel_joint"]
    right_wheel_names: ["base_right_wheel_joint"]
    wheel_separation: 0.305
    wheel_radius: 0.034
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    open_loop: false
    position_feedback: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.2
    velocity_rolling_window_size: 10
    publish_limited_velocity: true
    pose_covariance_diagonal: [0.01, 0.01, 0.0, 0.0, 0.0, 0.10]
    twist_covariance_diagonal: [0.02, 0.02, 0.0, 0.0, 0.0, 0.20]
    linear.x.max_velocity: 0.10
    linear.x.min_velocity: -0.10
    linear.x.max_acceleration: 0.15
    linear.x.max_deceleration: -0.50
    linear.x.max_acceleration_reverse: -0.15
    linear.x.max_deceleration_reverse: 0.50
    angular.z.max_velocity: 0.3
    angular.z.min_velocity: -0.3
    angular.z.max_acceleration: 0.5
    angular.z.max_deceleration: -1.0
    angular.z.max_acceleration_reverse: -0.5
    angular.z.max_deceleration_reverse: 1.0
